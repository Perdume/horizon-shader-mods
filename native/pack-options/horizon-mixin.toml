[mod]
id = "pack_options"
version = "0.2.0"
priority = 100

[compatibility]
# Nightly 2026-10-30 (ba6344a), the installed version; not yet built. Same pin as the other bundles.
horizon_revision = "ba6344a59cb9e755b730dcf02285fc0d33b97d3c"

# Options > Mods > Shader Options: the packs of shaderpacks/ to apply, then the settings of the pack in use
# in the groups the pack's own `screen` lists give (a water group first). A click on a setting gives it its
# next value, keeps it in shader-options/<pack>.txt (pack_connect writes it into the pack's files as they
# are read) and has the game load the pack again.
#
# The game's own mod page: it asks `native_mods` which mods to list and `native_settings` and
# `native_settings_click` for a mod's buttons (crates/horizon-client/src/game/native_hooks.rs, and the
# targets of native-hooks.json). Module ids and injection ids share one namespace.
[[module]]
id = "logic_module"
file = "crates/horizon-client/src/game.rs"
name = "pack_options_logic"
source = "logic.rs"

[[module]]
id = "runtime_module"
file = "crates/horizon-client/src/game.rs"
name = "pack_options"
source = "runtime.rs"

[[injection]]
id = "list_page"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "mods.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "mods" },
]

[[injection]]
id = "page_buttons"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "buttons" },
]

[[injection]]
id = "page_click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
